<section class="hype-hero" id="hypeHero1">

  <div class="hype-hero__bg" aria-hidden="true">
    <span class="hype-hero__blob hype-hero__blob--1"></span>
    <span class="hype-hero__blob hype-hero__blob--2"></span>
    <span class="hype-hero__grid"></span>
  </div>

  <div class="hype-hero__container">

    <div class="hype-hero__text">

      <div class="hype-hero__badge" data-hype-el="badgeWrap">
        <span class="hype-hero__dot"></span>
        <span data-hype-el="badgeText"></span>
      </div>

      <div class="hype-hero__heading-wrap" data-hype-el="headingWrap"></div>

      <p class="hype-hero__sub" data-hype-el="subText"></p>

      <div class="hype-hero__stats">
        <div class="hype-hero__stat">
          <span class="hype-hero__stat-num" data-hype-el="statNumber1"></span>
          <span class="hype-hero__stat-label" data-hype-el="statLabel1"></span>
        </div>
        <div class="hype-hero__stat-sep" aria-hidden="true"></div>
        <div class="hype-hero__stat">
          <span class="hype-hero__stat-num" data-hype-el="statNumber2"></span>
          <span class="hype-hero__stat-label" data-hype-el="statLabel2"></span>
        </div>
      </div>

      <div class="hype-hero__cta-row">
        <a class="hype-hero__btn" data-hype-el="buttonLink" href="#">
          <span data-hype-el="buttonText"></span>
          <svg class="hype-hero__btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <p class="hype-hero__trust" data-hype-el="trustText"></p>
      </div>

    </div>

    <div class="hype-hero__media">
      <div class="hype-hero__media-glow"></div>
      <img class="hype-hero__img" data-hype-el="heroImage" src="" alt="" />
      <div class="hype-hero__media-badge" data-hype-el="mediaBadgeWrap">
        <span data-hype-el="mediaBadgeText"></span>
      </div>
    </div>

  </div>
</section>

<style>
#hypeHero1{
  --h-bg:#0D0D0F;
  --h-bg-2:#151518;
  --h-text:#FFFFFF;
  --h-sub-text:#B7B7BE;
  --h-accent:#D4FF3F;
  --h-accent-2:#7A5CFF;
  --h-badge-bg:rgba(212,255,63,0.10);
  --h-badge-text:#D4FF3F;
  --h-btn-bg:#D4FF3F;
  --h-btn-text:#0D0D0F;
  --h-btn-bg-hover:#c2ec2a;
  --h-stat-num:#FFFFFF;
  --h-stat-label:#8B8B93;
  --h-trust:#8B8B93;
  --h-blob-1:#D4FF3F;
  --h-blob-2:#7A5CFF;
  --h-media-badge-bg:#151518;
  --h-media-badge-text:#FFFFFF;
  --font-heading:'Arial',sans-serif;
  --font-body:'Arial',sans-serif;

  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,var(--h-bg) 0%,var(--h-bg-2) 100%);
  padding:110px 24px 100px;
  box-sizing:border-box;
  font-family:var(--font-body);
}
#hypeHero1 *{ box-sizing:border-box; }

#hypeHero1 .hype-hero__bg{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
}
#hypeHero1 .hype-hero__blob{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.35;
  animation:hypeFloat 9s ease-in-out infinite;
}
#hypeHero1 .hype-hero__blob--1{
  width:420px; height:420px;
  background:var(--h-blob-1);
  top:-120px; left:-80px;
  animation-delay:0s;
}
#hypeHero1 .hype-hero__blob--2{
  width:380px; height:380px;
  background:var(--h-blob-2);
  bottom:-140px; right:-60px;
  animation-delay:1.4s;
}
#hypeHero1 .hype-hero__grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 20%, black 40%, transparent 75%);
}

@keyframes hypeFloat{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(30px,-25px) scale(1.08); }
}

#hypeHero1 .hype-hero__container{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:60px;
}

#hypeHero1 .hype-hero__text{ flex:1 1 560px; min-width:0; }

#hypeHero1 .hype-hero__badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--h-badge-bg);
  color:var(--h-badge-text) !important;
  padding:8px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.02em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(14px);
  animation:hypeUp 0.7s ease forwards;
  animation-delay:0.05s;
}
#hypeHero1 .hype-hero__dot{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--h-accent);
  animation:hypePulse 1.6s ease-in-out infinite;
}
@keyframes hypePulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:0.4; transform:scale(1.6); }
}

#hypeHero1 .hype-hero__heading-wrap{
  margin:22px 0 20px;
  opacity:0;
  transform:translateY(18px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.18s;
}
#hypeHero1 .hype-hero__heading-wrap h1,
#hypeHero1 .hype-hero__heading-wrap h2{
  margin:0;
  font-family:var(--font-heading);
  font-weight:800;
  line-height:1.02;
  letter-spacing:-0.02em;
  font-size:clamp(34px,5.2vw,64px);
  color:var(--h-text) !important;
  text-transform:uppercase;
}
#hypeHero1 .hype-hero__heading-wrap em{
  font-style:normal;
  color:var(--h-accent) !important;
}

#hypeHero1 .hype-hero__sub{
  margin:0 0 32px;
  font-family:var(--font-body);
  font-size:clamp(16px,1.7vw,19px);
  line-height:1.55;
  color:var(--h-sub-text) !important;
  max-width:520px;
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.3s;
}

#hypeHero1 .hype-hero__stats{
  display:flex;
  align-items:center;
  gap:22px;
  margin-bottom:36px;
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.42s;
}
#hypeHero1 .hype-hero__stat{ display:flex; flex-direction:column; gap:2px; }
#hypeHero1 .hype-hero__stat-num{
  font-family:var(--font-heading);
  font-weight:800;
  font-size:clamp(24px,2.6vw,32px);
  color:var(--h-stat-num) !important;
  line-height:1;
}
#hypeHero1 .hype-hero__stat-label{
  font-size:13px;
  color:var(--h-stat-label) !important;
  max-width:150px;
  line-height:1.3;
}
#hypeHero1 .hype-hero__stat-sep{
  width:1px; height:38px;
  background:rgba(255,255,255,0.12);
}

#hypeHero1 .hype-hero__cta-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.54s;
}

#hypeHero1 .hype-hero__btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--h-btn-bg);
  color:var(--h-btn-text) !important;
  font-family:var(--font-body);
  font-weight:700;
  font-size:16px;
  text-decoration:none !important;
  padding:17px 30px;
  border-radius:12px;
  transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  box-shadow:0 0 0 rgba(212,255,63,0);
}
#hypeHero1 .hype-hero__btn:hover{
  background:var(--h-btn-bg-hover);
  transform:translateY(-3px);
  box-shadow:0 14px 30px -8px rgba(212,255,63,0.55);
}
#hypeHero1 .hype-hero__btn:active{ transform:translateY(-1px); }
#hypeHero1 .hype-hero__btn-arrow{
  transition:transform 0.25s ease;
}
#hypeHero1 .hype-hero__btn:hover .hype-hero__btn-arrow{
  transform:translateX(4px);
}

#hypeHero1 .hype-hero__trust{
  margin:0;
  font-size:13px;
  color:var(--h-trust) !important;
  max-width:200px;
  line-height:1.4;
}

#hypeHero1 .hype-hero__media{
  position:relative;
  flex:1 1 420px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  opacity:0;
  transform:translateY(24px) scale(0.97);
  animation:hypeUp 0.9s ease forwards;
  animation-delay:0.28s;
}
#hypeHero1 .hype-hero__media-glow{
  position:absolute;
  width:80%;
  height:80%;
  background:radial-gradient(circle, var(--h-accent) 0%, transparent 70%);
  opacity:0.18;
  filter:blur(50px);
  z-index:0;
  animation:hypeFloat 8s ease-in-out infinite;
}
#hypeHero1 .hype-hero__img{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  height:auto;
  border-radius:20px;
  display:block;
  object-fit:cover;
  animation:hypeFloatImg 5s ease-in-out infinite;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
}
@keyframes hypeFloatImg{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-16px); }
}

#hypeHero1 .hype-hero__media-badge{
  position:absolute;
  z-index:2;
  bottom:14px;
  left:-14px;
  background:var(--h-media-badge-bg);
  color:var(--h-media-badge-text) !important;
  font-family:var(--font-body);
  font-weight:700;
  font-size:13px;
  padding:12px 18px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 16px 30px -10px rgba(0,0,0,0.5);
  animation:hypeFloatImg 5s ease-in-out infinite;
  animation-delay:0.4s;
}

@keyframes hypeUp{
  to{ opacity:1; transform:translateY(0) scale(1); }
}

@media (max-width: 1100px){
  #hypeHero1 .hype-hero__container{ gap:40px; }
}

@media (max-width: 860px){
  #hypeHero1{ padding:90px 20px 70px; }
  #hypeHero1 .hype-hero__container{
    flex-direction:column-reverse;
    text-align:center;
  }
  #hypeHero1 .hype-hero__text{ display:flex; flex-direction:column; align-items:center; }
  #hypeHero1 .hype-hero__sub{ max-width:520px; }
  #hypeHero1 .hype-hero__stats{ justify-content:center; }
  #hypeHero1 .hype-hero__cta-row{ flex-direction:column; align-items:center; }
  #hypeHero1 .hype-hero__trust{ max-width:280px; text-align:center; }
  #hypeHero1 .hype-hero__media{ margin-bottom:20px; }
  #hypeHero1 .hype-hero__media-badge{ left:50%; transform:translateX(-50%); bottom:-16px; }
  #hypeHero1 .hype-hero__blob--1{ width:260px; height:260px; }
  #hypeHero1 .hype-hero__blob--2{ width:240px; height:240px; }
}

@media (max-width: 480px){
  #hypeHero1 .hype-hero__img{ max-width:100%; }
  #hypeHero1 .hype-hero__btn{ width:100%; justify-content:center; }
}
</style>

<script>
(function(){

  /* =========================================================
     CONFIG — ВЕСЬ КОНТЕНТ, КОЛЬОРИ ТА ШРИФТИ РЕДАГУЮТЬСЯ ТУТ
     ========================================================= */
  var CONFIG = {

    /* ---------- SEO ---------- */
    headingLevel: "h1", /* ЗМІНИТИ на "h2" якщо цей блок НЕ перший на сторінці */

    /* ---------- ТЕКСТИ ---------- */
    badgeText: "Маркетингова агенція повного циклу", /* ЗМІНИТИ */
    headingHtml: "HYPE SMM — виводимо бренди <em>в топ соцмереж</em>", /* ЗМІНИТИ. Текст в <em>...</em> буде виділено акцентним кольором */
    subText: "SMM, контент, Reels, фото- та відеозйомка, таргетована реклама Meta та Google Ads, дизайн і маркетингова стратегія. Працюємо з бізнесами по всій Європі, США та Іспанії.", /* ЗМІНИТИ */

    statNumber1: "150+", /* ЗМІНИТИ */
    statLabel1: "проєктів реалізовано для клієнтів", /* ЗМІНИТИ */
    statNumber2: "x3", /* ЗМІНИТИ */
    statLabel2: "середнє зростання охоплень після SMM-стратегії", /* ЗМІНИТИ */

    buttonText: "Залишити заявку", /* ЗМІНИТИ */
    buttonLink: "#order", /* ЗМІНИТИ на посилання/якір форми заявки або popup Tilda */

    trustText: "Довіряють бренди з Іспанії, Європи та США", /* ЗМІНИТИ */

    /* ---------- ЗОБРАЖЕННЯ ---------- */
    heroImage: "https://placehold.co/880x1080/1a1a1d/d4ff3f?text=HYPE+SMM", /* ЗМІНИТИ на посилання свого фото */
    heroImageAlt: "Команда маркетингової агенції HYPE SMM за роботою над рекламною кампанією", /* ЗМІНИТИ опис фото для SEO (alt) */

    mediaBadgeText: "Meta & Google Ads Partner", /* ЗМІНИТИ (або залиш порожнім рядком "" щоб приховати бейдж) */

    /* ---------- ШРИФТИ (Google Fonts) ---------- */
    fontHeading: "Manrope", /* ЗМІНИТИ назву шрифту для заголовків */
    fontBody: "Inter", /* ЗМІНИТИ назву шрифту для тексту і кнопок */
    fontHeadingUrl: "@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap');", /* ЗМІНИТИ посилання @import для заголовкового шрифту */
    fontBodyUrl: "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');", /* ЗМІНИТИ посилання @import для шрифту тексту */

    /* ---------- КОЛЬОРИ ---------- */
    colorBg: "#0D0D0F", /* ЗМІНИТИ фон блоку (верх) */
    colorBg2: "#151518", /* ЗМІНИТИ фон блоку (низ градієнта) */
    colorText: "#FFFFFF", /* ЗМІНИТИ колір основного заголовка */
    colorSubText: "#B7B7BE", /* ЗМІНИТИ колір підзаголовка/опису */
    colorAccent: "#D4FF3F", /* ЗМІНИТИ акцентний колір (крапка, виділене слово, блоби) */
    colorAccent2: "#7A5CFF", /* ЗМІНИТИ другий акцентний колір (фоновий блоб) */

    colorBadgeBg: "rgba(212,255,63,0.10)", /* ЗМІНИТИ фон бейджа над заголовком */
    colorBadgeText: "#D4FF3F", /* ЗМІНИТИ колір тексту бейджа */

    colorButtonBg: "#D4FF3F", /* ЗМІНИТИ фон кнопки CTA */
    colorButtonText: "#0D0D0F", /* ЗМІНИТИ колір тексту кнопки (важливо з !important, бо Tilda фарбує посилання в оранжевий) */
    colorButtonHoverBg: "#c2ec2a", /* ЗМІНИТИ фон кнопки при наведенні */

    colorStatNumber: "#FFFFFF", /* ЗМІНИТИ колір цифр-показників */
    colorStatLabel: "#8B8B93", /* ЗМІНИТИ колір підпису під цифрами */
    colorTrustText: "#8B8B93", /* ЗМІНИТИ колір тексту довіри під кнопкою */

    colorMediaBadgeBg: "#151518", /* ЗМІНИТИ фон плашки на фото */
    colorMediaBadgeText: "#FFFFFF" /* ЗМІНИТИ колір тексту плашки на фото */
  };
  /* ===================== КІНЕЦЬ CONFIG ===================== */


  var root = document.getElementById("hypeHero1");
  if(!root){ return; }

  /* --- Підключення шрифтів Google Fonts через JS --- */
  var fontStyle = document.createElement("style");
  fontStyle.innerHTML = CONFIG.fontHeadingUrl + " " + CONFIG.fontBodyUrl;
  document.head.appendChild(fontStyle);

  /* --- Застосування шрифтів та кольорів як CSS-змінних --- */
  root.style.setProperty("--font-heading", "'" + CONFIG.fontHeading + "', sans-serif");
  root.style.setProperty("--font-body", "'" + CONFIG.fontBody + "', sans-serif");

  root.style.setProperty("--h-bg", CONFIG.colorBg);
  root.style.setProperty("--h-bg-2", CONFIG.colorBg2);
  root.style.setProperty("--h-text", CONFIG.colorText);
  root.style.setProperty("--h-sub-text", CONFIG.colorSubText);
  root.style.setProperty("--h-accent", CONFIG.colorAccent);
  root.style.setProperty("--h-accent-2", CONFIG.colorAccent2);
  root.style.setProperty("--h-badge-bg", CONFIG.colorBadgeBg);
  root.style.setProperty("--h-badge-text", CONFIG.colorBadgeText);
  root.style.setProperty("--h-btn-bg", CONFIG.colorButtonBg);
  root.style.setProperty("--h-btn-text", CONFIG.colorButtonText);
  root.style.setProperty("--h-btn-bg-hover", CONFIG.colorButtonHoverBg);
  root.style.setProperty("--h-stat-num", CONFIG.colorStatNumber);
  root.style.setProperty("--h-stat-label", CONFIG.colorStatLabel);
  root.style.setProperty("--h-trust", CONFIG.colorTrustText);
  root.style.setProperty("--h-blob-1", CONFIG.colorAccent);
  root.style.setProperty("--h-blob-2", CONFIG.colorAccent2);
  root.style.setProperty("--h-media-badge-bg", CONFIG.colorMediaBadgeBg);
  root.style.setProperty("--h-media-badge-text", CONFIG.colorMediaBadgeText);

  /* --- Створення заголовка потрібного рівня (h1 / h2) --- */
  var headingWrap = root.querySelector('[data-hype-el="headingWrap"]');
  var headingTag = (CONFIG.headingLevel === "h2") ? "h2" : "h1";
  var headingEl = document.createElement(headingTag);
  headingEl.innerHTML = CONFIG.headingHtml;
  headingWrap.appendChild(headingEl);

  /* --- Заповнення текстових полів --- */
  function setText(name, value){
    var el = root.querySelector('[data-hype-el="' + name + '"]');
    if(el){ el.textContent = value; }
  }
  setText("badgeText", CONFIG.badgeText);
  setText("subText", CONFIG.subText);
  setText("statNumber1", CONFIG.statNumber1);
  setText("statLabel1", CONFIG.statLabel1);
  setText("statNumber2", CONFIG.statNumber2);
  setText("statLabel2", CONFIG.statLabel2);
  setText("buttonText", CONFIG.buttonText);
  setText("trustText", CONFIG.trustText);
  setText("mediaBadgeText", CONFIG.mediaBadgeText);

  /* --- Кнопка CTA --- */
  var buttonLink = root.querySelector('[data-hype-el="buttonLink"]');
  if(buttonLink){ buttonLink.setAttribute("href", CONFIG.buttonLink); }

  /* --- Зображення --- */
  var img = root.querySelector('[data-hype-el="heroImage"]');
  if(img){
    img.setAttribute("src", CONFIG.heroImage);
    img.setAttribute("alt", CONFIG.heroImageAlt);
  }

  /* --- Плашка на фото (ховаємо якщо текст порожній) --- */
  var mediaBadgeWrap = root.querySelector('[data-hype-el="mediaBadgeWrap"]');
  if(mediaBadgeWrap && !CONFIG.mediaBadgeText){
    mediaBadgeWrap.style.display = "none";
  }

})();
</script>
