<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPE SMM Agency</title>
</head>
<body style="margin:0;padding:0;">

<section class="hype-hero" id="hypeHero1">

  <div class="hype-hero__bg" aria-hidden="true">
    <svg class="hype-hero__ymark" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 20 L60 70 L100 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="60" y1="70" x2="60" y2="150" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span class="hype-hero__dots"></span>
  </div>

  <div class="hype-hero__inner">

    <nav class="hype-hero__nav" data-hype-el="navWrap">
      <div class="hype-hero__logo">
        <span class="hype-hero__logo-main" data-hype-el="logoText"></span>
        <span class="hype-hero__logo-sub" data-hype-el="logoSubText"></span>
      </div>
      <ul class="hype-hero__nav-links" data-hype-el="navLinks"></ul>
      <a class="hype-hero__nav-btn" data-hype-el="navButtonLink" href="#">
        <span data-hype-el="navButtonText"></span>
      </a>
      <button class="hype-hero__burger" data-hype-el="burgerBtn" type="button" aria-label="Відкрити меню" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <ul class="hype-hero__mobile-menu" data-hype-el="mobileMenu"></ul>

    <div class="hype-hero__main">

      <div class="hype-hero__text">

        <div class="hype-hero__badge" data-hype-el="badgeWrap">
          <span class="hype-hero__badge-line"></span>
          <span data-hype-el="badgeText"></span>
        </div>

        <div class="hype-hero__heading-wrap" data-hype-el="headingWrap"></div>

        <span class="hype-hero__rule" aria-hidden="true"></span>

        <p class="hype-hero__sub" data-hype-el="subText"></p>

        <div class="hype-hero__cta-row">
          <a class="hype-hero__btn" data-hype-el="buttonLink" href="#">
            <span data-hype-el="buttonText"></span>
            <svg class="hype-hero__btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>

      </div>

      <div class="hype-hero__media">
        <img class="hype-hero__img" data-hype-el="heroImage" src="" alt="" />
      </div>

    </div>

    <div class="hype-hero__stats" data-hype-el="statsWrap"></div>

  </div>
</section>

<style>
#hypeHero1{
  /* ---- dark theme за замовчуванням, JS підставить реальні кольори з CONFIG ---- */
  --h-bg-deep:#111B27;
  --h-bg-panel:#2C313A;
  --h-text-main:#FFFFFF;
  --h-text-muted:#BFC3CC;
  --h-accent:#6B4A8A;
  --h-nav-text:#EAEAEA;
  --h-btn-bg:#6B4A8A;
  --h-btn-text:#FFFFFF;
  --h-btn-hover:#7d5a9d;
  --h-stat-num:#FFFFFF;
  --h-stat-label:#8891A0;
  --h-border:rgba(255,255,255,0.08);
  --font-heading:'Arial',sans-serif;
  --font-body:'Arial',sans-serif;

  position:relative;
  overflow:hidden;
  background:var(--h-bg-deep);
  padding:0 24px 70px;
  box-sizing:border-box;
  font-family:var(--font-body);
  transition:background 0.4s ease;
}
#hypeHero1 *{ box-sizing:border-box; }
#hypeHero1 ul{ list-style:none; margin:0; padding:0; }

/* decorative layer */
#hypeHero1 .hype-hero__bg{
  position:absolute; inset:0; z-index:0; pointer-events:none;
}
#hypeHero1 .hype-hero__ymark{
  position:absolute;
  top:90px; right:6%;
  width:90px; height:120px;
  color:var(--h-accent);
  opacity:0.18;
  animation:hypeYFloat 7s ease-in-out infinite;
}
@keyframes hypeYFloat{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-14px) rotate(3deg); }
}
#hypeHero1 .hype-hero__dots{
  position:absolute;
  bottom:40px; left:4%;
  width:110px; height:70px;
  background-image:radial-gradient(var(--h-text-muted) 1.4px, transparent 1.4px);
  background-size:12px 12px;
  opacity:0.35;
}

#hypeHero1 .hype-hero__inner{
  position:relative; z-index:1;
  max-width:1220px;
  margin:0 auto;
}

/* nav */
#hypeHero1 .hype-hero__nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:26px 0 70px;
}
#hypeHero1 .hype-hero__logo{
  display:flex;
  flex-direction:column;
  line-height:1;
}
#hypeHero1 .hype-hero__logo-main{
  font-family:var(--font-heading);
  font-weight:800;
  font-size:22px;
  letter-spacing:0.14em;
  color:var(--h-text-main) !important;
}
#hypeHero1 .hype-hero__logo-sub{
  font-size:9px;
  letter-spacing:0.32em;
  color:var(--h-text-muted) !important;
  margin-top:4px;
}
#hypeHero1 .hype-hero__nav-links{
  display:flex;
  gap:34px;
}
#hypeHero1 .hype-hero__nav-links li a{
  color:var(--h-nav-text) !important;
  text-decoration:none !important;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.01em;
  transition:opacity 0.2s ease;
}
#hypeHero1 .hype-hero__nav-links li a:hover{ opacity:0.65; }
#hypeHero1 .hype-hero__nav-btn{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--h-border);
  color:var(--h-nav-text) !important;
  text-decoration:none !important;
  font-size:13px;
  font-weight:600;
  padding:10px 20px;
  border-radius:8px;
  transition:background 0.25s ease, border-color 0.25s ease;
  white-space:nowrap;
}
#hypeHero1 .hype-hero__nav-btn:hover{
  background:var(--h-accent);
  border-color:var(--h-accent);
  color:#FFFFFF !important;
}

/* бургер-кнопка (показується лише на мобільних) */
#hypeHero1 .hype-hero__burger{
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  width:36px;
  height:36px;
  padding:0;
  background:transparent;
  border:none;
  cursor:pointer;
  flex-shrink:0;
}
#hypeHero1 .hype-hero__burger span{
  display:block;
  width:22px;
  height:2px;
  background:var(--h-nav-text);
  border-radius:2px;
  transition:transform 0.25s ease, opacity 0.25s ease;
}
#hypeHero1 .hype-hero__burger[aria-expanded="true"] span:nth-child(1){
  transform:translateY(7px) rotate(45deg);
}
#hypeHero1 .hype-hero__burger[aria-expanded="true"] span:nth-child(2){
  opacity:0;
}
#hypeHero1 .hype-hero__burger[aria-expanded="true"] span:nth-child(3){
  transform:translateY(-7px) rotate(-45deg);
}

/* випадне мобільне меню */
#hypeHero1 .hype-hero__mobile-menu{
  display:none;
  overflow:hidden;
  max-height:0;
  opacity:0;
  transition:max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
  padding:0 4px;
}
#hypeHero1 .hype-hero__mobile-menu.is-open{
  max-height:400px;
  opacity:1;
  padding:6px 4px 18px;
}
#hypeHero1 .hype-hero__mobile-menu li + li{
  border-top:1px solid var(--h-border);
}
#hypeHero1 .hype-hero__mobile-menu li a{
  display:block;
  padding:13px 4px;
  color:var(--h-nav-text) !important;
  text-decoration:none !important;
  font-size:15px;
  font-weight:500;
}

/* main content */
#hypeHero1 .hype-hero__main{
  display:flex;
  align-items:center;
  gap:64px;
  padding-bottom:70px;
}
#hypeHero1 .hype-hero__text{ flex:1 1 560px; min-width:0; }

#hypeHero1 .hype-hero__badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--h-accent) !important;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.16em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(12px);
  animation:hypeUp 0.7s ease forwards;
  animation-delay:0.05s;
}
#hypeHero1 .hype-hero__badge-line{
  width:26px; height:1px;
  background:var(--h-accent);
  display:inline-block;
}

#hypeHero1 .hype-hero__heading-wrap{
  margin:22px 0 0;
  opacity:0;
  transform:translateY(18px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.16s;
}
#hypeHero1 .hype-hero__heading-wrap h1,
#hypeHero1 .hype-hero__heading-wrap h2{
  margin:0;
  font-family:var(--font-heading);
  font-weight:800;
  line-height:1.04;
  letter-spacing:-0.01em;
  font-size:clamp(34px,5.4vw,66px);
  color:var(--h-text-main) !important;
  text-transform:uppercase;
}
#hypeHero1 .hype-hero__heading-wrap .hype-hero__line{ display:block; }
#hypeHero1 .hype-hero__heading-wrap .hype-hero__line--accent{
  color:var(--h-accent) !important;
}

#hypeHero1 .hype-hero__rule{
  display:block;
  width:64px; height:2px;
  background:var(--h-accent);
  margin:26px 0 24px;
  opacity:0;
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.26s;
}

#hypeHero1 .hype-hero__sub{
  margin:0 0 36px;
  font-family:var(--font-body);
  font-size:clamp(15px,1.6vw,18px);
  line-height:1.6;
  color:var(--h-text-muted) !important;
  max-width:480px;
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.34s;
}

#hypeHero1 .hype-hero__cta-row{
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.44s;
}
#hypeHero1 .hype-hero__btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--h-btn-bg);
  color:var(--h-btn-text) !important;
  font-family:var(--font-body);
  font-weight:700;
  font-size:15px;
  text-decoration:none !important;
  padding:16px 28px;
  border-radius:10px;
  transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
#hypeHero1 .hype-hero__btn:hover{
  background:var(--h-btn-hover);
  transform:translateY(-3px);
  box-shadow:0 16px 30px -10px rgba(107,74,138,0.55);
}
#hypeHero1 .hype-hero__btn:active{ transform:translateY(-1px); }
#hypeHero1 .hype-hero__btn-arrow{ transition:transform 0.25s ease; }
#hypeHero1 .hype-hero__btn:hover .hype-hero__btn-arrow{ transform:translateX(4px); }

/* media */
#hypeHero1 .hype-hero__media{
  flex:1 1 420px;
  min-width:0;
  opacity:0;
  transform:translateY(24px) scale(0.98);
  animation:hypeUp 0.9s ease forwards;
  animation-delay:0.22s;
}
#hypeHero1 .hype-hero__img{
  width:100%;
  max-width:460px;
  height:auto;
  display:block;
  margin:0 auto;
  border-radius:16px;
  object-fit:cover;
  animation:hypeFloatImg 5.5s ease-in-out infinite;
  box-shadow:0 30px 60px -24px rgba(0,0,0,0.55);
}
@keyframes hypeFloatImg{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

@keyframes hypeUp{
  to{ opacity:1; transform:translateY(0) scale(1); }
}

/* stats bar */
#hypeHero1 .hype-hero__stats{
  display:flex;
  flex-wrap:wrap;
  gap:0;
  border-top:1px solid var(--h-border);
  padding-top:32px;
  opacity:0;
  transform:translateY(16px);
  animation:hypeUp 0.8s ease forwards;
  animation-delay:0.55s;
}
#hypeHero1 .hype-hero__stat{
  flex:1 1 140px;
  padding:0 24px 10px 0;
  border-right:1px solid var(--h-border);
  margin-right:24px;
}
#hypeHero1 .hype-hero__stat:last-child{ border-right:none; margin-right:0; }
#hypeHero1 .hype-hero__stat-num{
  display:block;
  font-family:var(--font-heading);
  font-weight:800;
  font-size:clamp(22px,2.4vw,30px);
  color:var(--h-stat-num) !important;
  line-height:1;
  margin-bottom:6px;
}
#hypeHero1 .hype-hero__stat-label{
  font-size:12.5px;
  color:var(--h-stat-label) !important;
  line-height:1.35;
}

/* responsive */
@media (max-width: 980px){
  #hypeHero1 .hype-hero__nav-links{ display:none; }
  #hypeHero1 .hype-hero__nav-btn{ display:none; }
  #hypeHero1 .hype-hero__burger{ display:flex; }
}
@media (min-width: 981px){
  #hypeHero1 .hype-hero__mobile-menu{ display:none !important; }
}
@media (max-width: 860px){
  #hypeHero1{ padding:0 18px 34px; }
  #hypeHero1 .hype-hero__nav{ padding:16px 0; gap:14px; }
  #hypeHero1 .hype-hero__mobile-menu{ display:block; }
  #hypeHero1 .hype-hero__main{
    flex-direction:column-reverse;
    text-align:center;
    gap:22px;
    padding-bottom:26px;
  }
  #hypeHero1 .hype-hero__media{ margin-bottom:0; }
  #hypeHero1 .hype-hero__img{ max-width:280px; }
  #hypeHero1 .hype-hero__text{ display:flex; flex-direction:column; align-items:center; }
  #hypeHero1 .hype-hero__badge{ justify-content:center; }
  #hypeHero1 .hype-hero__heading-wrap{ margin-top:12px; }
  #hypeHero1 .hype-hero__rule{ margin:16px auto 14px; }
  #hypeHero1 .hype-hero__sub{ max-width:420px; margin-bottom:22px; }
  #hypeHero1 .hype-hero__stats{
    flex-direction:column;
    gap:10px;
    padding-top:20px;
    margin-top:6px;
  }
  #hypeHero1 .hype-hero__stat{
    border-right:none;
    margin-right:0;
    padding:0 0 10px;
    border-bottom:1px solid var(--h-border);
  }
  #hypeHero1 .hype-hero__stat:last-child{ border-bottom:none; padding-bottom:0; }
  #hypeHero1 .hype-hero__ymark{ opacity:0.1; width:50px; height:66px; top:14px; right:16px; }
  #hypeHero1 .hype-hero__dots{ display:none; }
}
@media (max-width: 480px){
  #hypeHero1{ padding:0 16px 28px; }
  #hypeHero1 .hype-hero__btn{ width:100%; justify-content:center; padding:14px 24px; }
  #hypeHero1 .hype-hero__logo-main{ font-size:18px; }
  #hypeHero1 .hype-hero__heading-wrap h1,
  #hypeHero1 .hype-hero__heading-wrap h2{ line-height:1.08; }
  #hypeHero1 .hype-hero__img{ max-width:220px; }
  #hypeHero1 .hype-hero__sub{ font-size:14px; }
}
</style>

<script>
(function(){

  /* =========================================================
     CONFIG — ВЕСЬ КОНТЕНТ, КОЛЬОРИ ТА ШРИФТИ РЕДАГУЮТЬСЯ ТУТ
     ========================================================= */
  var CONFIG = {

    /* ---------- SEO / СТРУКТУРА ---------- */
    headingLevel: "h1", /* ЗМІНИТИ на "h2" якщо цей блок НЕ перший на сторінці */
    showNav: true, /* ЗМІНИТИ на false якщо на сайті вже є окремий блок меню (щоб не дублювати навігацію) */
    theme: "dark", /* ЗМІНИТИ на "light" щоб увімкнути світлу тему бренду HYPE */

    /* ---------- ЛОГОТИП / НАВІГАЦІЯ ---------- */
    logoText: "HYPE", /* ЗМІНИТИ */
    logoSubText: "SMM AGENCY", /* ЗМІНИТИ */
    navLinks: [
      { text: "Послуги", link: "#services" }, /* ЗМІНИТИ текст/посилання */
      { text: "Про нас", link: "#about" },     /* ЗМІНИТИ текст/посилання */
      { text: "Кейси", link: "#cases" },       /* ЗМІНИТИ текст/посилання */
      { text: "Блог", link: "#blog" }          /* ЗМІНИТИ текст/посилання */
    ],
    navButtonText: "Зв'язатися", /* ЗМІНИТИ */
    navButtonLink: "#contact", /* ЗМІНИТИ на якір форми/popup Tilda */

    /* ---------- ТЕКСТИ ГОЛОВНОГО ЕКРАНА ---------- */
    badgeText: "Маркетингова агенція повного циклу", /* ЗМІНИТИ */

    /* Заголовок розбитий на 3 рядки, як у брендбуку HYPE (СТРАТЕГІЯ. КОНТЕНТ. РЕЗУЛЬТАТ.) */
    headingLine1: "СТРАТЕГІЯ.", /* ЗМІНИТИ */
    headingLine2: "КОНТЕНТ.", /* ЗМІНИТИ */
    headingLine3: "РЕЗУЛЬТАТ.", /* ЗМІНИТИ — цей рядок автоматично буде виділено акцентним кольором */

    subText: "Ми вирощуємо бренди, які виділяються та масштабуються: SMM, контент, Reels, фото- і відеозйомка, таргет у Meta та Google Ads.", /* ЗМІНИТИ */

    buttonText: "Залишити заявку", /* ЗМІНИТИ */
    buttonLink: "#contact", /* ЗМІНИТИ на якір форми/popup Tilda */

    /* ---------- СТАТИСТИКА (можна лишити 2, 3 або 4 елементи) ---------- */
    stats: [
      { number: "10+", label: "років досвіду в digital" },       /* ЗМІНИТИ */
      { number: "36+", label: "успішних проєктів" },              /* ЗМІНИТИ */
      { number: "150+", label: "задоволених клієнтів" },          /* ЗМІНИТИ */
      { number: ">2M", label: "сукупне охоплення аудиторії" }     /* ЗМІНИТИ */
    ],

    /* ---------- ЗОБРАЖЕННЯ ---------- */
    heroImage: "https://images.unsplash.com/photo-1758876017801-f5a892ee460a?fm=jpg&q=80&w=900&auto=format&fit=crop", /* ЗМІНИТИ на посилання свого фото (зараз тимчасове безкоштовне фото з Unsplash) */
    heroImageAlt: "Спеціалістка маркетингової агенції HYPE SMM працює за ноутбуком у сучасному офісі", /* ЗМІНИТИ опис фото для SEO (alt) */

    /* ---------- ШРИФТИ (Google Fonts, за брендбуком HYPE) ---------- */
    fontHeading: "Montserrat", /* ЗМІНИТИ назву шрифту для заголовків */
    fontBody: "Manrope", /* ЗМІНИТИ назву шрифту для тексту і кнопок */
    fontHeadingUrl: "@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');", /* ЗМІНИТИ посилання @import для заголовкового шрифту */
    fontBodyUrl: "@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');", /* ЗМІНИТИ посилання @import для шрифту тексту */

    /* ---------- КОЛЬОРИ — ТЕМНА ТЕМА (dark theme з брендбуку) ---------- */
    colorsDark: {
      bgDeep: "#111B27",        /* ЗМІНИТИ фон блоку (найтемніший, за навігацією) */
      bgPanel: "#2C313A",       /* ЗМІНИТИ основний фон секції hero */
      textMain: "#FFFFFF",      /* ЗМІНИТИ колір заголовка */
      textMuted: "#BFC3CC",     /* ЗМІНИТИ колір опису/другорядного тексту */
      accent: "#6B4A8A",        /* ЗМІНИТИ фірмовий фіолетовий акцент (бейдж, лінія, виділений рядок, кнопка) */
      navText: "#EAEAEA",       /* ЗМІНИТИ колір тексту навігації */
      btnBg: "#6B4A8A",         /* ЗМІНИТИ фон кнопки CTA */
      btnText: "#FFFFFF",       /* ЗМІНИТИ колір тексту кнопки (важливо з !important — Tilda фарбує посилання в оранжевий) */
      btnHover: "#7d5a9d",      /* ЗМІНИТИ фон кнопки при наведенні */
      statNum: "#FFFFFF",       /* ЗМІНИТИ колір цифр статистики */
      statLabel: "#8891A0",     /* ЗМІНИТИ колір підписів під цифрами */
      border: "rgba(255,255,255,0.08)" /* ЗМІНИТИ колір тонких розділювальних ліній */
    },

    /* ---------- КОЛЬОРИ — СВІТЛА ТЕМА (light theme з брендбуку) ---------- */
    colorsLight: {
      bgDeep: "#ECE7E1",        /* ЗМІНИТИ фон блоку (за навігацією) */
      bgPanel: "#F5F3EF",       /* ЗМІНИТИ основний фон секції hero */
      textMain: "#2C313A",      /* ЗМІНИТИ колір заголовка */
      textMuted: "#6B6459",     /* ЗМІНИТИ колір опису/другорядного тексту */
      accent: "#6B4A8A",        /* ЗМІНИТИ фірмовий фіолетовий акцент (той самий в обох темах) */
      navText: "#2C313A",       /* ЗМІНИТИ колір тексту навігації */
      btnBg: "#6B4A8A",         /* ЗМІНИТИ фон кнопки CTA */
      btnText: "#FFFFFF",       /* ЗМІНИТИ колір тексту кнопки (важливо з !important) */
      btnHover: "#5b3d74",      /* ЗМІНИТИ фон кнопки при наведенні */
      statNum: "#2C313A",       /* ЗМІНИТИ колір цифр статистики */
      statLabel: "#8B8378",     /* ЗМІНИТИ колір підписів під цифрами */
      border: "rgba(44,49,58,0.12)" /* ЗМІНИТИ колір тонких розділювальних ліній */
    }
  };
  /* ===================== КІНЕЦЬ CONFIG ===================== */


  var root = document.getElementById("hypeHero1");
  if(!root){ return; }

  /* --- Виправлення адаптиву на телефонах --------------------------------
     Якщо в налаштуваннях сторінки Tilda НЕ увімкнено "Мобільна версія",
     сторінка віддає фіксований viewport (масштабовану копію 980px-макета),
     і через це @media (max-width: ...) в CSS нижче ніколи не спрацьовує
     на реальних телефонах. Цей блок коду примусово виставляє коректний
     viewport, щоб адаптив працював навіть якщо перемикач в Tilda забули
     увімкнути. Рекомендовано ДОДАТКОВО увімкнути "Мобільна версія" в
     налаштуваннях сторінки Tilda — це основне і правильне рішення. --- */
  (function fixViewport(){
    var vp = document.querySelector('meta[name="viewport"]');
    if(!vp){
      vp = document.createElement("meta");
      vp.setAttribute("name", "viewport");
      document.head.appendChild(vp);
    }
    var content = vp.getAttribute("content") || "";
    if(content.indexOf("device-width") === -1){
      vp.setAttribute("content", "width=device-width, initial-scale=1");
    }
  })();

  /* --- Підключення шрифтів Google Fonts через JS --- */
  var fontStyle = document.createElement("style");
  fontStyle.innerHTML = CONFIG.fontHeadingUrl + " " + CONFIG.fontBodyUrl;
  document.head.appendChild(fontStyle);

  root.style.setProperty("--font-heading", "'" + CONFIG.fontHeading + "', sans-serif");
  root.style.setProperty("--font-body", "'" + CONFIG.fontBody + "', sans-serif");

  /* --- Застосування кольорів обраної теми --- */
  var C = (CONFIG.theme === "light") ? CONFIG.colorsLight : CONFIG.colorsDark;
  root.style.setProperty("--h-bg-deep", C.bgDeep);
  root.style.setProperty("--h-bg-panel", C.bgPanel);
  root.style.setProperty("--h-text-main", C.textMain);
  root.style.setProperty("--h-text-muted", C.textMuted);
  root.style.setProperty("--h-accent", C.accent);
  root.style.setProperty("--h-nav-text", C.navText);
  root.style.setProperty("--h-btn-bg", C.btnBg);
  root.style.setProperty("--h-btn-text", C.btnText);
  root.style.setProperty("--h-btn-hover", C.btnHover);
  root.style.setProperty("--h-stat-num", C.statNum);
  root.style.setProperty("--h-stat-label", C.statLabel);
  root.style.setProperty("--h-border", C.border);
  root.style.background = C.bgDeep;

  /* --- Прибираємо білі смуги зверху/знизу: Tilda огортає блок T123
     у службовий контейнер .t-rec зі своїм padding і білим фоном.
     Знаходимо цей контейнер і підганяємо його під колір теми. --- */
  var recWrap = root.closest(".t-rec") || root.parentElement;
  if(recWrap){
    recWrap.style.paddingTop = "0";
    recWrap.style.paddingBottom = "0";
    recWrap.style.background = C.bgDeep;
  }
  var recInner = root.closest(".t-rec__wrapper, .t-rec__inner, .r");
  if(recInner){
    recInner.style.background = C.bgDeep;
  }

  /* --- Навігація (можна вимкнути через CONFIG.showNav) --- */
  var navWrap = root.querySelector('[data-hype-el="navWrap"]');
  var mobileMenu = root.querySelector('[data-hype-el="mobileMenu"]');
  if(!CONFIG.showNav){
    navWrap.style.display = "none";
    if(mobileMenu){ mobileMenu.style.display = "none"; }
  } else {
    var navLinksEl = root.querySelector('[data-hype-el="navLinks"]');
    CONFIG.navLinks.forEach(function(item){
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.textContent = item.text;
      a.setAttribute("href", item.link);
      li.appendChild(a);
      navLinksEl.appendChild(li);
    });
    var navBtn = root.querySelector('[data-hype-el="navButtonLink"]');
    navBtn.setAttribute("href", CONFIG.navButtonLink);

    /* --- Заповнення мобільного випадного меню тими самими пунктами --- */
    CONFIG.navLinks.forEach(function(item){
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.textContent = item.text;
      a.setAttribute("href", item.link);
      li.appendChild(a);
      mobileMenu.appendChild(li);
    });
    var navBtnMobileLi = document.createElement("li");
    var navBtnMobileA = document.createElement("a");
    navBtnMobileA.textContent = CONFIG.navButtonText;
    navBtnMobileA.setAttribute("href", CONFIG.navButtonLink);
    navBtnMobileA.style.color = "var(--h-accent)";
    navBtnMobileA.style.fontWeight = "700";
    navBtnMobileLi.appendChild(navBtnMobileA);
    mobileMenu.appendChild(navBtnMobileLi);

    /* --- Бургер: відкриття/закриття мобільного меню --- */
    var burgerBtn = root.querySelector('[data-hype-el="burgerBtn"]');
    if(burgerBtn && mobileMenu){
      burgerBtn.addEventListener("click", function(){
        var isOpen = mobileMenu.classList.toggle("is-open");
        burgerBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
      mobileMenu.addEventListener("click", function(e){
        if(e.target.tagName === "A"){
          mobileMenu.classList.remove("is-open");
          burgerBtn.setAttribute("aria-expanded", "false");
        }
      });
    }
  }

  /* --- Заповнення текстових полів --- */
  function setText(name, value){
    var el = root.querySelector('[data-hype-el="' + name + '"]');
    if(el){ el.textContent = value; }
  }
  setText("logoText", CONFIG.logoText);
  setText("logoSubText", CONFIG.logoSubText);
  setText("navButtonText", CONFIG.navButtonText);
  setText("badgeText", CONFIG.badgeText);
  setText("subText", CONFIG.subText);
  setText("buttonText", CONFIG.buttonText);

  /* --- Заголовок потрібного рівня (h1 / h2), 3 рядки, останній — акцентний --- */
  var headingWrap = root.querySelector('[data-hype-el="headingWrap"]');
  var headingTag = (CONFIG.headingLevel === "h2") ? "h2" : "h1";
  var headingEl = document.createElement(headingTag);

  var lines = [CONFIG.headingLine1, CONFIG.headingLine2, CONFIG.headingLine3];
  lines.forEach(function(lineText, i){
    var span = document.createElement("span");
    span.className = "hype-hero__line" + (i === lines.length - 1 ? " hype-hero__line--accent" : "");
    span.textContent = lineText;
    headingEl.appendChild(span);
  });
  headingWrap.appendChild(headingEl);

  /* --- Кнопка CTA --- */
  var buttonLink = root.querySelector('[data-hype-el="buttonLink"]');
  if(buttonLink){ buttonLink.setAttribute("href", CONFIG.buttonLink); }

  /* --- Зображення --- */
  var img = root.querySelector('[data-hype-el="heroImage"]');
  if(img){
    img.setAttribute("src", CONFIG.heroImage);
    img.setAttribute("alt", CONFIG.heroImageAlt);
  }

  /* --- Статистика + мікроанімація "рахунок вгору" при появі --- */
  var statsWrap = root.querySelector('[data-hype-el="statsWrap"]');
  var statNumEls = [];

  CONFIG.stats.forEach(function(stat){
    var item = document.createElement("div");
    item.className = "hype-hero__stat";

    var numEl = document.createElement("span");
    numEl.className = "hype-hero__stat-num";
    numEl.textContent = "0";
    numEl.setAttribute("data-final", stat.number);

    var labelEl = document.createElement("span");
    labelEl.className = "hype-hero__stat-label";
    labelEl.textContent = stat.label;

    item.appendChild(numEl);
    item.appendChild(labelEl);
    statsWrap.appendChild(item);
    statNumEls.push(numEl);
  });

  function animateStat(el){
    var finalText = el.getAttribute("data-final");
    var match = finalText.match(/\d+/);
    if(!match){ el.textContent = finalText; return; }

    var target = parseInt(match[0], 10);
    var prefix = finalText.slice(0, match.index);
    var suffix = finalText.slice(match.index + match[0].length);
    var start = 0;
    var duration = 1100;
    var startTime = null;

    function step(timestamp){
      if(!startTime){ startTime = timestamp; }
      var progress = Math.min((timestamp - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var current = Math.floor(start + (target - start) * eased);
      el.textContent = prefix + current + suffix;
      if(progress < 1){
        requestAnimationFrame(step);
      } else {
        el.textContent = finalText;
      }
    }
    requestAnimationFrame(step);
  }

  var statsAnimated = false;
  function triggerStatsIfVisible(){
    if(statsAnimated){ return; }
    var rect = statsWrap.getBoundingClientRect();
    if(rect.top < window.innerHeight - 60){
      statsAnimated = true;
      statNumEls.forEach(animateStat);
      window.removeEventListener("scroll", triggerStatsIfVisible);
    }
  }

  if("IntersectionObserver" in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && !statsAnimated){
          statsAnimated = true;
          statNumEls.forEach(animateStat);
          observer.disconnect();
        }
      });
    }, { threshold: 0.3 });
    observer.observe(statsWrap);
  } else {
    window.addEventListener("scroll", triggerStatsIfVisible);
    triggerStatsIfVisible();
  }

})();
</script>

</body>
